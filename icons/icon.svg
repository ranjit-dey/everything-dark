<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#1e2138" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#383b58" stroke-width="2"/>
  <!-- Glowing Crescent Moon -->
  <path d="M 66,28 C 45,28 28,45 28,66 C 28,87 45,104 66,104 C 77,104 87,99 94,92 C 78,92 64,78 64,62 C 64,47 75,34 90,30 C 83,28 75,28 66,28 Z" 
        fill="url(#moonGrad)" filter="url(#glow)"/>
  <!-- Sparkles -->
  <path d="M 94,40 Q 94,48 102,48 Q 94,48 94,56 Q 94,48 86,48 Q 94,48 94,40 Z" fill="#fbbf24" />
  <circle cx="84" cy="80" r="3" fill="#67e8f9" opacity="0.8"/>
  <circle cx="102" cy="70" r="2" fill="#e0e7ff" opacity="0.7"/>
</svg>